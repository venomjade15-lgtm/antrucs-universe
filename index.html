/* ===== V4 enhancements ===== */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:9990;pointer-events:none}
.dock{position:fixed;left:18px;bottom:18px;z-index:9991;display:flex;gap:8px}
.dock button{font:700 10px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;padding:11px 14px;background:rgba(8,9,13,.82);border:1px solid #ffffff2a;color:#f4f1eb;backdrop-filter:blur(10px);transition:border-color .3s,box-shadow .3s,color .3s}
.dock button:hover,.dock button.on{border-color:#d6b16c;box-shadow:0 0 18px rgba(214,177,108,.28)}
.dock button.on{color:#d6b16c}
.dock button:focus-visible,.dots a:focus-visible{outline:2px solid #d6b16c;outline-offset:3px}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:14px}
.dots a{width:9px;height:9px;border:1px solid #fff9;border-radius:50%;position:relative;transition:all .3s}
.dots a.on{background:#e3313c;border-color:#e3313c;box-shadow:0 0 12px #e3313c;transform:scale(1.35)}
.dots a:after{content:attr(data-l);position:absolute;right:20px;top:50%;transform:translateY(-50%);font:600 10px 'DM Sans',sans-serif;letter-spacing:1.5px;color:#f4f1eb;opacity:0;white-space:nowrap;transition:opacity .25s;pointer-events:none}
.dots a:hover:after{opacity:1}
@media(max-width:900px){.dots{display:none}.dock{left:10px;bottom:10px}}
.mapbox{position:relative;height:clamp(480px,74vh,700px);border:1px solid #ffffff1a;background:radial-gradient(ellipse at 50% 40%,#1a1d27,#07080c 75%);overflow:hidden}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:16px;top:14px;display:flex;gap:18px;flex-wrap:wrap;font:600 10px 'DM Sans',sans-serif;letter-spacing:1.6px;color:#a5a5ad;pointer-events:none}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.hud{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hud i{position:absolute;left:50%;top:48%;border:1px dashed rgba(107,209,255,.5);border-radius:50%;transform:translate(-50%,-50%);animation:hspin 22s linear infinite}
.hud i.b{border-style:solid;opacity:.35;animation-direction:reverse;animation-duration:34s}
.hud:after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(to bottom,transparent,rgba(107,209,255,.16),transparent);animation:hscan 5s linear infinite}
.hud span{position:absolute;font:600 10px 'DM Sans',sans-serif;letter-spacing:2px;color:#6bd1ff;text-shadow:0 0 8px #31b5ff}
.hud .a{left:20px;top:20px}.hud .b2{right:20px;top:20px}.hud .c{left:20px;bottom:20px}
@keyframes hspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes hscan{from{top:-90px}to{top:100%}}
.radar{width:190px;margin:0 auto 12px}
.radar svg{width:100%;display:block;overflow:visible}
.rp{transform-origin:90px 90px;animation:rin 1s cubic-bezier(.2,.8,.2,1)}
@keyframes rin{from{transform:scale(0);opacity:0}}
@media(prefers-reduced-motion:reduce){.hud i,.hud:after,.rp{animation:none}}
/* trailer */
.trl{position:fixed;inset:0;z-index:99990;background:#030409;display:grid;place-items:center;transition:opacity .9s}
.trl.out{opacity:0;pointer-events:none}
.trl:before,.trl:after{content:"";position:absolute;left:0;right:0;height:14vh;background:#000;z-index:2}
.trl:before{top:0}.trl:after{bottom:0}
.trl-t{font:900 clamp(40px,9vw,120px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;text-align:center;letter-spacing:2px;padding:0 24px;opacity:0;transform:scale(1.12);filter:blur(10px);transition:opacity .8s,transform 2.4s cubic-bezier(.2,.7,.2,1),filter .8s;color:#f4f1eb}
.trl-t.in{opacity:1;transform:scale(1);filter:blur(0)}
.trl-t em{font-style:normal;color:#e3313c;text-shadow:0 0 30px rgba(227,49,60,.6)}
.trl-skip{position:absolute;right:24px;bottom:calc(14vh + 14px);z-index:3;font:700 10px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#f4f1eb;background:rgba(8,9,13,.6);border:1px solid #ffffff2a;padding:10px 14px}
.trl-skip:hover{border-color:#d6b16c}
/* palette */
.pal{position:fixed;inset:0;z-index:99991;background:rgba(3,4,9,.72);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal.open{display:flex}
.pal-box{width:min(640px,calc(100% - 28px));background:#0f1118;border:1px solid #ffffff2a;box-shadow:0 30px 80px #000c,0 0 40px rgba(227,49,60,.15)}
.pal input{width:100%;padding:20px 22px;background:none;border:0;border-bottom:1px solid #ffffff1a;color:#f4f1eb;font:500 16px 'DM Sans',sans-serif;outline:0}
.pal ul{max-height:50vh;overflow:auto;list-style:none;margin:0;padding:6px}
.pal li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font:500 14px 'DM Sans',sans-serif;color:#c8c6c2;cursor:pointer}
.pal li small{color:#8b8a88;font-size:11px;letter-spacing:1px}
.pal li.sel{background:#e3313c22;color:#fff;box-shadow:inset 2px 0 #e3313c}
/* poster parallax */
.feature-art{--px:0;--py:0}
.feature-art .armor{translate:calc(var(--px)*20px) calc(var(--py)*14px);transition:translate .25s ease-out}
.pz{position:absolute;pointer-events:none;transition:translate .25s ease-out}
.pz-t{left:0;right:0;top:30%;text-align:center;font:900 clamp(70px,11vw,150px)/.85 'Barlow Condensed',sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22);letter-spacing:-2px;text-transform:uppercase;translate:calc(var(--px)*-26px) calc(var(--py)*-16px)}
.pz-s{inset:0;opacity:.8;translate:calc(var(--px)*-8px) calc(var(--py)*-6px);background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 70%,#fff,transparent),radial-gradient(1px 1px at 35% 80%,#fff,transparent),radial-gradient(1px 1px at 55% 55%,#fff,transparent)}
.pz-g{inset:0;background:radial-gradient(260px 260px at var(--gx,50%) var(--gy,50%),rgba(107,209,255,.2),transparent 70%)}
.pz-f{left:-5%;right:-5%;bottom:0;height:38%;background:linear-gradient(to top,#05070b,transparent);translate:calc(var(--px)*30px) 0}
.pz-c{left:0;right:0;bottom:16px;text-align:center;font:600 10px 'DM Sans',sans-serif;letter-spacing:4px;color:#ffffffaa}
/* extras */
.dock{flex-wrap:wrap;max-width:calc(100vw - 36px)}
.dscore{align-self:center;font:700 10px 'DM Sans',sans-serif;letter-spacing:2px;color:#d6b16c;padding:0 6px;text-shadow:0 0 10px rgba(214,177,108,.5)}
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:9992;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 12px var(--red);pointer-events:none}
.aur{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.55;filter:blur(30px);background:radial-gradient(40% 35% at 20% 30%,rgba(49,168,255,.16),transparent 70%),radial-gradient(35% 40% at 80% 20%,rgba(227,49,60,.14),transparent 70%),radial-gradient(40% 40% at 60% 85%,rgba(79,209,139,.12),transparent 70%);animation:aur 40s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) rotate(8deg) scale(1.08)}}
.toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:9992;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;background:rgba(8,9,13,.94);border:1px solid var(--gold);color:#f4f1eb;font:600 11px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;box-shadow:0 0 24px rgba(214,177,108,.25);animation:tin .4s ease-out,tout .5s 3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.orb{position:fixed;z-index:9989;width:26px;height:26px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 35%,#fff,var(--gold) 45%,transparent 72%);box-shadow:0 0 26px var(--gold),0 0 60px rgba(214,177,108,.4);animation:orbf 3s ease-in-out infinite alternate,tin .6s}
@keyframes orbf{to{translate:24px -34px;scale:1.25}}
.term{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:99992;background:rgba(4,6,10,.95);border-top:1px solid var(--gold);backdrop-filter:blur(10px);display:none;flex-direction:column;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#9fe8b8}
.term.open{display:flex}
.term-o{flex:1;overflow:auto;padding:14px 20px;white-space:pre-wrap}
.term-i{display:flex;gap:8px;padding:10px 20px;border-top:1px solid #ffffff1a;color:var(--gold)}
.term-i input{flex:1;background:none;border:0;outline:0;color:#f4f1eb;font:inherit}
@media(prefers-reduced-motion:reduce){.aur,.orb{animation:none}}

/* ===== Canon sections ===== */
.au-sec .head p{max-width:430px}
.gnav{display:flex;gap:8px;flex-wrap:wrap;margin:-18px 0 40px}
.gnav a{padding:11px 16px;border:1px solid var(--c);color:#f4f1eb;font:700 10px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;transition:background .25s}
.gnav a:hover{background:color-mix(in srgb,var(--c) 25%,transparent)}
.grp{margin-bottom:70px;scroll-margin-top:90px}
.grp>h3{font:800 clamp(34px,5.5vw,60px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;border-left:3px solid var(--c);padding-left:16px;margin:0 0 10px}
.grp>p{color:var(--muted);max-width:720px;margin:0 0 24px;line-height:1.6}
.pfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pf{padding:22px;background:linear-gradient(145deg,#1a1d27,#14161f);border:1px solid #ffffff14;border-top:2px solid var(--c);display:flex;flex-direction:column;gap:12px;transition:transform .3s,border-color .3s,box-shadow .3s}
.pf:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 40px -18px var(--c)}
.pf-h{display:flex;gap:12px;align-items:center}
.pf-i{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 15px 'Barlow Condensed',sans-serif;background:radial-gradient(circle at 30% 30%,var(--c),#0e1017);color:#fff}
.pf h4{margin:0;font:800 23px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.pf small{color:var(--gold);font:600 10px 'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.pf ul,.di ul{margin:0;padding-left:18px;color:#c8c6c2;font-size:13px;line-height:1.6}
.pf li,.di li{list-style:disc;margin-bottom:4px}
.nyr{margin:0;font-size:12px;color:#8b8a88;letter-spacing:.3px;border-top:1px dashed #ffffff1a;padding-top:10px}
.nyr b{color:var(--gold);font-weight:700}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel a{font:600 10px 'DM Sans',sans-serif;letter-spacing:1px;padding:6px 9px;border:1px solid #ffffff24;color:#c8c6c2;transition:border-color .2s}
.rel a:hover{border-color:var(--c,#d6b16c);color:#fff}
.pf .btn{margin-top:auto;padding:12px 16px;justify-content:center}
.di-r{font:700 10px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.di{display:flex;flex-direction:column;gap:12px}
.mvn{color:var(--muted);font:600 11px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;margin:18px 0}
.mvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mv{--c:#d6b16c;padding:18px;background:#12141b;border:1px solid #ffffff14;border-left:3px solid var(--c);position:relative;display:flex;flex-direction:column;gap:8px;transition:transform .3s,box-shadow .3s;scroll-margin-top:120px}
.mv[hidden]{display:none}
.mv.h{--c:#67bfff}.mv.v{--c:#e3313c}.mv.p{--c:#ff9a5a}.mv.u{--c:#8b8a88}
.mv:hover{transform:translateY(-3px)}
.mv b{position:absolute;right:14px;top:8px;font:800 40px 'Barlow Condensed',sans-serif;color:#ffffff10}
.mv .ty{font:700 9px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--c)}
.mv h4{margin:0;font:800 22px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;padding-right:40px}
.mv p{margin:0;font-size:12px;color:#a5a5ad;line-height:1.55}
.flash{animation:aufl 1.8s}
@keyframes aufl{0%,70%{box-shadow:0 0 0 2px var(--c,#d6b16c),0 0 44px var(--c,#d6b16c)}}
.det{border:1px solid #ffffff14;background:#12141b;margin-bottom:8px}
.det summary{padding:20px 24px;cursor:pointer;font:800 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;gap:16px;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary i{font-style:normal;color:var(--gold);transition:transform .3s}
.det[open] summary{color:var(--gold)}.det[open] summary i{transform:rotate(45deg)}
.det .db{padding:0 24px 22px;color:#c8c6c2;font-size:14px;line-height:1.75;max-width:820px}
.det .db p{margin:0 0 12px}.det ol{padding-left:20px;margin:0 0 12px}.det ol li{list-style:decimal;margin-bottom:6px}
.det .qt{border-left:2px solid var(--gold);padding:12px 16px;background:#15171f;color:#e7d9bf;font:italic 20px/1.4 'Barlow Condensed',sans-serif}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cl{padding:18px;border:1px dashed #ffffff2a;background:repeating-linear-gradient(135deg,#ffffff05 0 8px,transparent 8px 16px);font-size:14px;line-height:1.4;color:#c8c6c2;display:flex;flex-direction:column;gap:8px}
.cl span{font:700 9px 'DM Sans',sans-serif;letter-spacing:2.5px;color:var(--gold)}
</style>
</head>
<body>
  <div id="root"></div>
  
  <script>(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const NYR='Powers, origin and personal story: <b>Not Yet Revealed</b>';
const CH={
'Sentinel Knight':{a:'Jayson',r:'Technology hero',f:['Identity: Jayson.','Wears an advanced suit: dark metallic armour with glowing electric-blue lines, a distinctive chest symbol and a helmet.','Hero of the first film, Sentinel Knight (also called Neon Sentinel Knight).'],n:'Full ability list: <b>Coming Soon</b>'},
'Void':{a:'Spirit Realm',r:'Protector of the Void',f:['A man; a dark spirit from the Spirit Realm.','Protector of the Void, where our universe’s crystal is kept.','Abilities: controls darkness and controls shadows.']},
'Lumina':{a:'Light',r:'Teenage hero',f:['A teenage boy.','Power: controls light.','Origin: a laser beam hits a drug left in a laser facility and also hits Lumina. The drug reacts with the laser energy. Full sequence in Story Files.']},
'Slavion':{a:'From Space',r:'From space',f:['Comes from space.','Planned film: Slavion: War of Aetherion.'],n:'Species, abilities and origin: <b>Not Yet Revealed</b>'},
'Alpha Fox':{r:'In development',f:['Character in development; origin and powers are not yet confirmed.']},
'Xephonia':{a:'Plant life',r:'Queen of plant life',f:['Controls lotuses.','Described as the queen of plant life.','Planned film: Xephonia: Queen of Nature.']},
'Rophe':{a:'Technology',r:'Technology-focused',f:['Technology-focused fighter.','Wears a half-mech suit, comparable to Monic’s suit in the Sentinel Knight film.']}};
const G=[
{id:'sentinels',num:'01',key:'Sentinels',name:'The Sentinels',color:'#67bfff',glow:'#287fcf',sub:'Hero group 01',desc:'A superhero group in the Antrucs Universe with a major team role. Eight confirmed members, each with an original identity, power set and story.',members:['Sentinel Knight','Void','Lumina','Sky Render','Pulse Walker','Frost Warden','Holen Vansguard','Slavion']},
{id:'peace',num:'02',key:'Peace X Forum',name:'Peace X Forum',color:'#ff6b7a',glow:'#b72d3d',sub:'Hero group 02',desc:'Another hero group in the Antrucs Universe. Seven confirmed members; detailed profiles are being established.',members:['Dark Sentinel','Unholy Shepherd','Wu Zee Mo','Alpha Fox','Dr. X','Cold Flame','Quill']},
{id:'colony',num:'03',key:'The Colony',name:'The Colony',color:'#8acb8b',glow:'#498e5a',sub:'Group 03',desc:'Another group in the Antrucs Universe. Six confirmed members, including Xephonia and Rophe.',members:['Vaul Hawk','Rophe','Dark Faulin','Xephonia','Loop Worm','U-Losh']}];
const T=['Sentinel Knight','Slavion: War of Aetherion','Void: Prince of Darkness','Proton Legacy','Lumina','Claws Over Guns','Frost Warden','Visit From Hell','Void: The First Relics','The Sentinels','Lotus: River of Dawn','Holen','Sky Render','Sentinel Knight 2','The Sentinels 2','Born From Hell: Queen of Flame','Frost Warden 2','Peace X Forum','Dr. X Arise','Pulse Walker','Rophe','Sentinel Knight 3','The Colony','The XD-19','The Sentinels vs The G.U.O.R.A.F Bastards','Cold Flame Origins','BFH 2 (Born From Hell)','U-Losh Awakening','Vormid Tangle','Avares Noids','Vaul Hawk','Unholy Shepherd','Xephonia: Queen of Nature','Holen 2','Dark Faulin','Loop Worm Ascension','Proton Returns','Void: Spirits Conflicts','Quill','Lumina 2'];
const V=[24,27,29,30],P=[4,37],U=[6,8,11,16,25],SEQ=[14,15,17,22,27,34,40];
const NOTE={1:'Jayson’s first film. The full story is in Story Files.',2:'Features Slavion, who comes from space. Full plot not yet revealed.',3:'Void is a dark spirit from the Spirit Realm and protector of the Void.',4:'Proton can become liquid metal and disintegrate matter. He seeks revenge on Sentinel Knight. A full screenplay is in development.',5:'Lumina controls light. His origin is in Story Files.',21:'Rophe is technology-focused and wears a half-mech suit.',33:'Xephonia controls lotuses and is queen of plant life.',37:'Planned related movie to Proton Legacy.'};
const cat=i=>V.includes(i)?'v':P.includes(i)?'p':U.includes(i)?'u':'h';
const CL={h:'Hero / team film',v:'Villain film',p:'Proton storyline',u:'Category not yet confirmed'};
const kw=n=>n==='Holen Vansguard'?'Holen':n;
const rel=n=>{const m=T.map((t,i)=>[t,i+1]).filter(([t])=>t.includes(kw(n)));return m.length?'<div class="rel">'+m.map(([t,i])=>`<a href="#mv-${i}" data-go="mv-${i}">#${i} ${t}</a>`).join('')+'</div>':''};
const body=n=>{const c=CH[n]||{};return `<div class="di-r">${c.r||'Role: Not yet revealed'}</div>${c.f?'<ul>'+c.f.map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}<p class="nyr">${c.n||(c.f?'More details: <b>Coming Soon</b>':NYR)}</p>${rel(n)}`};
window.AUDOSS=n=>'<div class="di">'+body(n).replace(/<div class="di-r">.*?<\/div>/,'')+'</div>';
const Q=[];G.forEach(g=>g.members.forEach(n=>{const c=CH[n]||{};Q.push({name:n,alias:c.a||'Not yet revealed',faction:g.key,role:c.r||'Not yet revealed',tag:(n+' '+g.key+' '+(c.a||'')+' '+(c.r||'')).toLowerCase()})}));
const TL=[
{year:'EVENT 01',title:'The Porcelain Expedition',desc:'The Red Flight Squadron travels from Washington, D.C., to the Solomon Islands to recover a rare material called Porcelain from an ancient underwater site.',tag:'EXPEDITION'},
{year:'EVENT 02',title:'The Underwater Cave',desc:'Ancient mechanisms and traps guard the site. The cave collapses, Jayson is separated and the team believes he has died.',tag:'THE CAVE'},
{year:'EVENT 03',title:'The Book of the Alonaidian Cave',desc:'In a deeper chamber Jayson finds ancient writing, a locked box hidden in a statue, the Book and a separate manual about making weapons.',tag:'ALONAIDIAN CAVE'},
{year:'EVENT 04',title:'A New Family',desc:'A family warmly welcomes Jayson. He tries to return to America but cannot, and eventually meets a cargo container bound for Russia.',tag:'JOURNEY'},
{year:'EVENT 05',title:'The Suit Takes Shape',desc:'In Russia he meets a man who works with both the government and the rebels, and three scientists who use the weapons manual to help him develop a suit.',tag:'RUSSIA'},
{year:'EVENT 06',title:'Optivoc and Monic',desc:'Optivoc develops a powered suit; a malware-hit test ejects him before it explodes. Jayson later betrays a company and attacks Optivoc. Monic dies trying to save Jayson.',tag:'OPTIVOC'}];
window.AU={Q,TL,K:G.map(g=>({id:g.id,num:g.num,name:g.name,sub:g.sub,desc:g.desc,members:g.members,color:g.color,glow:g.glow})),X:{'Sentinel Knight':'Wisdom doesn’t belong to one, it’s for all so long as you have the capability.'}};

const ST=[
['Sentinel Knight: The Expedition','<p>The Red Flight Squadron travels from Washington, D.C., to the Solomon Islands. Their mission is to recover a rare material called Porcelain from an ancient underwater site.</p><p>Z-Tripper is a member of the six-person diving team. Lenz questions whether the mission is legitimate.</p>'],
['Sentinel Knight: The Underwater Cave','<p>The site holds ancient mechanisms and dangerous traps: stone projectiles, thorned rolling traps, shifting passages and a chamber that drains water.</p><p>During the expedition the cave collapses and Jayson becomes separated from the team. The team believes he has died.</p>'],
['Sentinel Knight: The Book of the Alonaidian Cave','<p>Jayson discovers a deeper chamber with ancient writing, a locked box concealed in a statue and a book called <em>The Book of the Alonaidian Cave</em>. It holds images of ancient people and statues and explains the origins and purpose of the cave.</p><p class="qt">“Wisdom doesn’t belong to one, it’s for all so long as you have the capability.”</p><p>Jayson also discovers a separate manual about making weapons.</p>'],
['Sentinel Knight: Jayson’s Journey','<ol><li>Jayson ends up with a family that warmly welcomes him.</li><li>He tries to return to America but cannot.</li><li>He encounters a cargo container being transported to Russia.</li><li>In Russia he meets a man who works with both the government and the rebels.</li><li>He meets three scientists who use the weapons manual to help him develop a suit.</li></ol><p>Jayson later betrays a company and attacks Optivoc.</p>'],
['Sentinel Knight: Optivoc and Monic','<p>Optivoc develops a high-tech powered suit with repulsors, propellers, jetpack cylinders, scanning capability and automatic ejection.</p><p>During a test, malware affects the repulsor settings. Optivoc is ejected before the suit explodes. Optivoc made Monic his weapon/tool because Monic did not have enough money.</p><p>Monic dies while trying to save Jayson. Monic refuses to accept that Jayson is lost.</p>'],
['Lumina: Origin Story','<ol><li>Lumina enters a facility that manufactures lasers.</li><li>Someone had left a drug at the facility, intended to cure albinism.</li><li>A laser beam hits the drug and also hits Lumina.</li><li>The drug reacts with the laser energy.</li><li>The incident gives Lumina the ability to control light.</li></ol>'],
['Proton Legacy','<p>Proton is a villain in the Antrucs Universe. He can transform into liquid metal, similar to mercury, and can disintegrate matter. He was accidentally created during a scientific experiment and seeks revenge on Sentinel Knight.</p><p>The exact reason for his revenge: <b>Not Yet Revealed</b>. A detailed screenplay is in development. Planned related movie: <em>Proton Returns</em>.</p>']];
const CLS=['Complete powers and origins of most Sentinels','Complete powers and origins of most Peace X Forum members','Complete powers and origins of most Colony members','Alpha Fox’s final origin and powers','Slavion’s full story and abilities','Why Proton wants revenge','Detailed plots of most of the 40 movies','Chronological order of all movies','Full identities and organisation of the villains','Connections between the hero groups','The history of the universe’s crystal','The history of the Spirit Realm','The full story of Aetherion'];
const head=(k,h,p)=>`<div class="head reveal"><div><div class="kicker">${k}</div><h2>${h}</h2></div><p>${p}</p></div>`;
const pf=(n,c)=>`<article class="pf" style="--c:${c}" id="pf-${n.replace(/\W+/g,'-')}"><div class="pf-h"><span class="pf-i">${n.slice(0,2).toUpperCase()}</span><div><h4>${n}</h4><small>${(CH[n]||{}).r||'Role not yet revealed'}</small></div></div>${body(n).replace(/<div class="di-r">.*?<\/div>/,'')}<button class="btn" data-open="${n}">Open dossier ＋</button></article>`;
function mk(id,html,cls){const s=document.createElement('section');s.id=id;s.className='au-sec '+(cls||'');s.innerHTML='<div class="wrap">'+html+'</div>';return s}
function build(){
  const gs=mk('groups','',''); gs.style.paddingTop='0';
  gs.firstChild.innerHTML=head('Group rosters','The Three Groups','Every confirmed member of the Sentinels, Peace X Forum and The Colony. Where details are not established they are marked Not Yet Revealed.')+'<div class="gnav">'+G.map(g=>`<a href="#g-${g.id}" data-go="g-${g.id}" style="--c:${g.color}">${g.name} · ${g.members.length}</a>`).join('')+'</div>'+G.map(g=>`<div class="grp" id="g-${g.id}" style="--c:${g.color}"><h3>${g.name}</h3><p>${g.desc}</p><div class="pfs">${g.members.map(n=>pf(n,g.color)).join('')}</div></div>`).join('');
  const ms=mk('movies','');
  ms.firstChild.innerHTML=head('Movie catalogue','All 40 Films','Titles are numbered in the creator’s list order. Release order, chronology and most plots are not yet revealed.')+`<div class="archive-controls"><div class="chips" id="mchips">${[['all','All 40'],['h','Hero / team'],['v','Villain films'],['p','Proton'],['u','Unclassified'],['s','Sequels']].map(([k,l],i)=>`<button class="chip ${i?'':'active'}" data-f="${k}">${l}</button>`).join('')}</div><div class="search-wrap"><input class="search" id="mq" placeholder="Search movies, characters, villains..." aria-label="Search movies"></div></div><p class="mvn" id="mvn"></p><div class="mvs">${T.map((t,j)=>{const i=j+1,c=cat(i);return `<article class="mv ${c}" id="mv-${i}" data-c="${c}" ${SEQ.includes(i)?'data-s="1"':''} data-k="${(t+' '+CL[c]+' '+(NOTE[i]||'')).toLowerCase()}"><b>${String(i).padStart(2,'0')}</b><span class="ty">${CL[c]}</span><h4>${t}</h4><p>${NOTE[i]||'Plot: Not Yet Revealed · Coming Soon'}</p></article>`}).join('')}</div>`;
  const vs=mk('villains','');
  vs.firstChild.innerHTML=head('Villain files','The Villains','Villains are not assumed to share one organisation. Their connections are not yet established.')+`<div class="pfs"><article class="pf" style="--c:#e3313c"><div class="pf-h"><span class="pf-i">PR</span><div><h4>Proton</h4><small>Villain</small></div></div><ul><li>Transforms into liquid metal, similar to mercury.</li><li>Can disintegrate matter.</li><li>Accidentally created during a scientific experiment.</li><li>Seeks revenge on Sentinel Knight.</li></ul><p class="nyr">Reason for revenge: <b>Not Yet Revealed</b></p>${rel('Proton')}</article>`+V.map(i=>`<article class="pf" style="--c:#e3313c"><div class="pf-h"><span class="pf-i">${String(i)}</span><div><h4>${T[i-1]}</h4><small>Villain film · creator confirmed</small></div></div><p class="nyr">Villain identity, powers, origin and organisation: <b>Not Yet Revealed</b></p><div class="rel"><a href="#mv-${i}" data-go="mv-${i}">View in catalogue</a></div></article>`).join('')+'</div>';
  const fs=mk('files','');fs.style.paddingTop='0';
  fs.firstChild.innerHTML=head('Story files','Canon Story Files','The confirmed story information of the Antrucs Universe.')+ST.map(([t,h],i)=>`<details class="det" id="st-${i}"><summary>${t}<i>＋</i></summary><div class="db">${h}</div></details>`).join('');
  const cs=mk('classified','');
  cs.firstChild.innerHTML=head('Classified','Not Yet Revealed','These parts of the universe are still being written. Check back as the creator confirms them.')+'<div class="cls">'+CLS.map(x=>`<div class="cl"><span>COMING SOON</span>${x}</div>`).join('')+'</div>';
  const a=$('#archive'),tl=$('#timeline');
  a.after(gs);gs.after(ms);ms.after(vs);tl.after(fs);fs.after(cs);
  let fc='all',fq='';
  window.AUF=(c,q)=>{fc=c;fq=q;$$('#mchips .chip').forEach(b=>b.classList.toggle('active',b.dataset.f===c));$('#mq').value=q;filt()};
  const filt=()=>{let n=0;$$('.mv').forEach(m=>{const ok=(fc==='all'||m.dataset.c===fc||(fc==='s'&&m.dataset.s))&&(!fq||m.dataset.k.includes(fq));m.hidden=!ok;if(ok)n++});$('#mvn').textContent='Showing '+n+' of 40 titles'};
  $('#mchips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fc=b.dataset.f;AUF(fc,fq)}};
  $('#mq').oninput=e=>{fq=e.target.value.trim().toLowerCase();filt()};filt();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  $$('.au-sec .reveal').forEach(x=>io.observe(x));
}
window.auGo=id=>{const e=document.getElementById(id);if(!e)return;if(e.classList.contains('mv')&&e.hidden)AUF('all','');
  if(e.tagName==='DETAILS')e.open=true;e.scrollIntoView({behavior:'smooth',block:e.classList.contains('mv')||e.tagName==='DETAILS'?'center':'start'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1800)};
window.auPerson=name=>{const i=$('.search');if(i&&i.value){Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(i,'');i.dispatchEvent(new Event('input',{bubbles:true}))}
  const all=$$('.archive .chip').find(c=>c.textContent==='All');if(all)all.click();setTimeout(()=>{const el=$$('.person').find(q=>$('strong',q).textContent===name);if(el)el.click()},80)};
document.addEventListener('click',e=>{const o=e.target.closest&&e.target.closest('[data-open]');if(o)return auPerson(o.dataset.open);
  const g=e.target.closest&&e.target.closest('[data-go]');if(g){e.preventDefault();auGo(g.dataset.go)}});

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#08090d;--panel:#12141b;--red:#e3313c;--gold:#d6b16c;--white:#f4f1eb;--muted:#a5a5ad;--line:#ffffff1a;--line2:#ffffff2a;--surface:#08090d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;overflow-x-clip}
.app-shell{min-height:100vh;position:relative;background:var(--bg);padding-top:var(--safe-area-inset-top);overflow-x-clip}
::selection{background:var(--red);color:white}
a{color:inherit;text-decoration:none}
.wrap{width:min(1220px,calc(100% - 40px));margin:0 auto;position:relative;z-index:2}

/* Grain + Vignette */
.grain{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.06;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 120% at 50% 0%, transparent 40%, rgba(0,0,0,0.6) 100%), radial-gradient(80% 60% at 80% 10%, rgba(227,49,60,0.14), transparent 50%)}

/* Scroll progress */
.scrollbar{position:fixed;top:var(--safe-area-inset-top);left:0;height:2px;background:linear-gradient(90deg,var(--red),var(--gold));z-index:100;transition:width 0.1s linear;box-shadow:0 0 10px var(--red)}

/* Loader */
.loader{position:fixed;inset:0;z-index:200;background:#040508;display:grid;place-items:center;transition:opacity 0.8s ease, transform 0.8s ease}
.loader.hide{opacity:0;pointer-events:none;transform:scale(1.02)}
.loader-inner{text-align:center}
.logo-glitch{font:900 clamp(48px,10vw,96px)/0.9 'Barlow Condensed';letter-spacing:-1px;position:relative}
.logo-glitch span{display:block}
.logo-glitch .stroke{color:transparent;-webkit-text-stroke:1px #fff8;filter:drop-shadow(0 0 12px rgba(227,49,60,0.6))}
.logo-glitch .solid{color:var(--red);margin-top:-0.05em;animation:glitch 0.2s steps(2) infinite alternate}
@keyframes glitch{0%{transform:translate(0)} 20%{transform:translate(-1px,1px)} 40%{transform:translate(1px,-1px)} 60%{transform:translate(-1px,0)} 80%{transform:translate(1px,1px)} 100%{transform:translate(0)}}
.load-bar{width:260px;height:1px;background:#ffffff15;margin:32px auto 12px;overflow:hidden;position:relative}
.load-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 0.1s}
.load-pct{font:700 12px 'Barlow Condensed';letter-spacing:4px;color:var(--muted)}
.load-kicker{font:600 10px 'DM Sans';letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}

/* Cursor */
.cursor-dot, .cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:99999;mix-blend-mode:difference}
.cursor-dot{width:6px;height:6px;background:white;border-radius:50%;transform:translate(-50%,-50%);transition:transform 0.15s, width 0.2s, height 0.2s}
.cursor-dot.hover{width:12px;height:12px}
.cursor-ring{width:36px;height:36px;border:1px solid #ffffffcc;border-radius:50%;transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s,border-color 0.25s}
.cursor-ring.hover{width:64px;height:64px;border-color:var(--red);background:rgba(227,49,60,0.12)}
@media(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

/* Nav */
.nav-wrap{position:fixed;top:0;left:0;right:0;z-index:50;transition:transform 0.45s cubic-bezier(.8,0,.2,1), background 0.3s, border-color 0.3s;background:rgba(8,9,13,0.88);backdrop-filter:blur(22px) saturate(1.2);border-bottom:1px solid var(--line)}
.nav-wrap.hidden{transform:translateY(-100%)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.brand{font:900 24px 'Barlow Condensed';letter-spacing:3px}
.brand span{color:var(--red)}
.nav-links{display:flex;gap:30px;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#c6c4c0;align-items:center}
.nav-links a{position:relative;padding:6px 0}
.nav-links a:after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:width 0.3s}
.nav-links a:hover:after{width:100%}
.nav-links a:hover{color:white}
.menu-btn{display:none;background:none;border:1px solid var(--line2);color:white;padding:10px 14px;font:700 11px 'Barlow Condensed';letter-spacing:2px}
.sound-toggle{display:flex;align-items:end;gap:3px;height:14px;cursor:pointer;padding:6px;border:1px solid var(--line2);background:rgba(255,255,255,0.04)}
.sound-toggle span{display:block;width:2px;background:var(--red);animation:equalizer 0.7s infinite ease-in-out}
.sound-toggle.off span{animation:none;height:2px!important;opacity:0.3}
.sound-toggle span:nth-child(2){animation-delay:0.2s;height:10px}
.sound-toggle span:nth-child(1){height:6px;animation-delay:0s}
.sound-toggle span:nth-child(3){height:14px;animation-delay:0.4s}
@keyframes equalizer{0%,100%{height:3px}50%{height:14px}}

/* Hero */
.hero{height:100svh;min-height:760px;max-height:1020px;position:relative;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;z-index:0}
.planet{position:absolute;width:min(62vw,720px);aspect-ratio:1;border-radius:50%;right:6%;top:10%;background:radial-gradient(circle at 36% 28%, #5d7a98, #243447 28%, #101a27 54%, #060a11 78%);box-shadow:inset -60px -30px 120px #020307, inset 20px 10px 60px rgba(255,255,255,0.08), 0 0 120px rgba(66,107,155,0.28);transform-style:preserve-3d;will-change:transform}
.planet-core{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 40%)}
.planet-ring{position:absolute;inset:-12%;border:1px solid rgba(214,177,108,0.38);border-radius:50%;transform:rotateX(75deg) rotateZ(-18deg);box-shadow:0 0 30px rgba(214,177,108,0.15)}
.planet-ring.r2{inset:-18%;border-color:rgba(103,191,255,0.22);transform:rotateX(68deg) rotateZ(28deg)}
.planet-ring.r3{inset:8%;border-color:rgba(255,255,255,0.07);transform:rotateX(72deg) rotateZ(-42deg)}
.planet-glow{position:absolute;inset:-30%;background:radial-gradient(circle at 50% 50%, rgba(103,191,255,0.14), transparent 60%);filter:blur(12px);animation:pulseGlow 6s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.hero-content{position:relative;z-index:2;padding-top:96px}
.eyebrow{font-size:10px;letter-spacing:4.5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px}
.eyebrow:before{content:"";width:36px;height:1px;background:var(--red);display:inline-block}
.k-title{font:900 clamp(78px,13vw,168px)/0.86 'Barlow Condensed';letter-spacing:-3px;margin:28px 0 18px;text-transform:uppercase}
.k-title .line{display:block}
.k-title .stroke{color:transparent;-webkit-text-stroke:1.2px #f4f1eb;position:relative}
.k-title .stroke:after{content:attr(data-text);position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:1.2px var(--red);clip-path:inset(0 100% 0 0);animation:strokeReveal 1.6s 0.8s forwards cubic-bezier(.7,0,.3,1)}
@keyframes strokeReveal{to{clip-path:inset(0 0 0 0)}}
.k-title .red{color:var(--red);text-shadow:0 0 30px rgba(227,49,60,0.5)}
.hero p{max-width:500px;color:#c8c6c2;font-size:14.5px;line-height:1.9;letter-spacing:0.1px}
.hero-stats{display:flex;gap:28px;margin:34px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.stat b{display:block;font:800 28px 'Barlow Condensed';color:white;letter-spacing:1px}
.stat i{font-style:normal;font:600 9px 'DM Sans';letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border:1px solid var(--line2);font:700 10px 'DM Sans';letter-spacing:2.2px;text-transform:uppercase;background:rgba(255,255,255,0.03);backdrop-filter:blur(8px);transition:transform 0.15s, border-color 0.3s, background 0.3s;cursor:pointer;will-change:transform}
.btn.primary{background:var(--red);border-color:var(--red);color:white;box-shadow:0 12px 30px rgba(227,49,60,0.28)}
.btn:hover{border-color:var(--gold);background:rgba(255,255,255,0.08)}
.btn .ripple{position:absolute;width:12px;height:12px;background:rgba(255,255,255,0.35);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ripple 0.6s ease-out}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(28);opacity:0}}
.scroll-ind{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;font:600 9px 'Barlow Condensed';letter-spacing:3px;color:#ffffff66;text-transform:uppercase}
.scroll-ind .line{width:1px;height:42px;background:linear-gradient(to bottom, white, transparent);animation:scrollLine 2s infinite}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}50.1%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Ticker */
.ticker{overflow:hidden;background:#0f1016;border-block:1px solid var(--line);padding:18px 0;white-space:nowrap;position:relative;z-index:3}
.ticker-track{display:flex;animation:marquee 42s linear infinite;width:max-content}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{font:700 13px 'Barlow Condensed';letter-spacing:3px;color:#a9a7a3;display:flex;align-items:center}
.ticker-item b{color:var(--red);margin:0 26px}
.ticker-item i{font-style:normal;color:var(--gold);margin:0 26px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Sections */
section{padding:110px 0;position:relative;z-index:2}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:48px}
.head h2{font:900 clamp(44px,6vw,82px)/0.9 'Barlow Condensed';letter-spacing:-1px;text-transform:uppercase;margin:16px 0 0}
.head p{max-width:360px;color:var(--muted);font-size:13.5px;line-height:1.85}
.kicker{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.feature{display:grid;grid-template-columns:1.05fr 0.95fr;background:linear-gradient(135deg,#1a1d27,#0d1017);border:1px solid var(--line);position:relative;overflow:hidden}
.feature-art{min-height:520px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#b52d4040,transparent 36%),radial-gradient(ellipse at bottom,#25405f,#0a0d13 70%)}
.armor{width:230px;height:300px;position:relative;filter:drop-shadow(0 0 36px #3da9ff66);animation:float 6s ease-in-out infinite}
.armor:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#e8eef2,#627c90 34%,#0f1c2a 62%,#b9c6cf);clip-path:polygon(50% 0,88% 15%,100% 45%,78% 100%,50% 82%,22% 100%,0 45%,12% 15%)}
.armor:after{content:"";position:absolute;inset:20% 26%;background:#102333;clip-path:polygon(50% 0,100% 22%,75% 100%,25% 100%,0 22%);border:2px solid #52bfff}
.core{position:absolute;z-index:2;top:47%;left:50%;width:44px;height:44px;background:#6bd1ff;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 32px #31b5ff, 0 0 12px white;animation:corePulse 2.4s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(45deg) scale(1.15)}}
.feature-info{padding:clamp(28px,4.5vw,56px);display:flex;flex-direction:column;justify-content:center}
.feature-info h3{font:900 clamp(48px,6vw,78px)/0.9 'Barlow Condensed';margin:18px 0}
.meta{color:#8b8a88;font-size:10px;letter-spacing:1.2px;margin:10px 0 20px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--gold)}
.feature-info p{font-size:13.5px;color:#bdbbc2;line-height:1.9;margin:0 0 14px}

/* Factions */
.faction-stack{display:grid;gap:26px}
.faction-panel{min-height:440px;position:relative;overflow:hidden;border:1px solid var(--line);background:#10131b;display:flex;align-items:center;padding:clamp(28px,5vw,58px);isolation:isolate;transition:transform 0.2s ease-out, border-color 0.3s;will-change:transform;--mx:50%;--my:50%}
.faction-panel:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 78% 48%,var(--glow),transparent 38%),linear-gradient(100deg,#090a0f 8%,#10121ad9 58%,#08090d99)}
.faction-panel:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(320px 320px at var(--mx) var(--my), rgba(255,255,255,0.14), transparent 70%);opacity:0;transition:opacity 0.4s}
.faction-panel:hover:after{opacity:1}
.faction-panel:hover{border-color:var(--orb)}
.faction-backdrop{position:absolute;z-index:-1;width:420px;height:420px;border:1px solid var(--orb);border-radius:50%;right:6%;top:50%;transform:translateY(-50%);box-shadow:0 0 0 34px #ffffff06,0 0 0 78px #ffffff03,0 0 80px var(--glow)}
.faction-backdrop:before,.faction-backdrop:after{content:"";position:absolute;border:1px solid var(--orb);border-radius:50%;inset:12%;transform:rotate(35deg) scaleY(.35);animation:spin 26s linear infinite}
.faction-backdrop:after{inset:24%;transform:rotate(-35deg) scaleY(.55);animation-duration:18s;animation-direction:reverse}
.faction-content{max-width:680px;position:relative;z-index:2}
.faction-content h3{font:900 clamp(48px,7vw,86px)/0.9 'Barlow Condensed';margin:16px 0}
.faction-content p{max-width:560px;color:#c4c3c8;font-size:13.5px;line-height:1.9}
.member-list{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0 28px}
.member-pill{padding:9px 13px;border:1px solid #ffffff22;background:rgba(8,9,13,0.6);color:#e8e2db;font:700 12px 'Barlow Condensed';letter-spacing:0.9px;text-transform:uppercase;transition:all 0.25s;cursor:pointer;backdrop-filter:blur(6px)}
.member-pill:hover{background:var(--glow);border-color:var(--orb);transform:translateY(-2px) scale(1.03);color:white;box-shadow:0 8px 20px rgba(0,0,0,0.4)}
.faction-mark{position:absolute;right:5%;bottom:-48px;font:900 clamp(160px,28vw,360px)/1 'Barlow Condensed';color:#ffffff07;pointer-events:none;letter-spacing:-8px}
.sentinels{--glow:#287fcf44;--orb:#67bfff88}
.peace{--glow:#b72d3d55;--orb:#ff6b7a88}
.colony{--glow:#498e5a44;--orb:#8acb8b88}
@keyframes spin{to{transform:rotate(360deg) scaleY(.35)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* Archive */
.archive{background:#0d0f15;border-block:1px solid var(--line)}
.archive-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border:1px solid var(--line2);background:#08090d;font:700 10px 'DM Sans';letter-spacing:2px;text-transform:uppercase;color:#9a9a9a;cursor:pointer;transition:all 0.25s}
.chip.active{background:var(--white);color:#08090d;border-color:var(--white)}
.chip:hover{border-color:var(--gold);color:white}
.search-wrap{position:relative;flex:1;min-width:260px;max-width:420px}
.search{width:100%;padding:16px 16px 16px 42px;background:#08090d;border:1px solid var(--line2);color:white;font:500 14px 'DM Sans';outline:none;transition:border-color 0.2s}
.search:focus{border-color:var(--gold)}
.search-wrap:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666;font-size:18px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.person{padding:18px 16px;background:linear-gradient(145deg,#1a1d27,#14161f);border:1px solid #ffffff12;position:relative;overflow:hidden;cursor:pointer;transition:all 0.35s;transform:translateY(16px);opacity:0}
.person.in{transform:translateY(0);opacity:1}
.person:before{content:"";position:absolute;inset:0;background:radial-gradient(240px 200px at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.12), transparent 70%);opacity:0;transition:opacity 0.3s}
.person:hover:before{opacity:1}
.person:hover{transform:translateY(-4px) scale(1.01);border-color:var(--gold);box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.person strong{display:block;font:700 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;position:relative;z-index:1}
.person small{color:#8a8990;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;position:relative;z-index:1}
.person .hl{background:var(--red);color:white;padding:0 2px}
.empty{grid-column:1/-1;text-align:center;color:#666;padding:32px;border:1px dashed var(--line);font-size:13px}
.card-orb{position:absolute;right:-20px;top:-20px;width:90px;height:90px;border:1px solid #ffffff12;border-radius:50%;box-shadow:0 0 0 18px #ffffff06,0 0 0 36px #ffffff03;pointer-events:none}

/* Modal */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(4,5,8,0.86);backdrop-filter:blur(18px);display:grid;place-items:center;padding:20px;animation:fadeIn 0.3s ease}
.modal{width:min(560px,100%);background:linear-gradient(145deg,#1c1f2b,#0e1017);border:1px solid #ffffff18;position:relative;overflow:hidden;animation:modalIn 0.45s cubic-bezier(.2,.8,.2,1)}
@keyframes modalIn{from{transform:translateY(24px) scale(0.98);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-top{padding:28px 28px 20px;display:flex;gap:18px;align-items:start;border-bottom:1px solid var(--line)}
.avatar{width:86px;height:86px;flex:0 0 86px;border-radius:4px;background:radial-gradient(circle at 30% 20%, #fff2, transparent 50%), linear-gradient(135deg, var(--a1), var(--a2));display:grid;place-items:center;font:900 32px 'Barlow Condensed';color:white;letter-spacing:1px;box-shadow:inset 0 0 0 1px #ffffff22, 0 10px 30px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.avatar:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%, rgba(255,255,255,0.22) 50%, transparent 60%);transform:translateX(-100%);animation:lightSweep 3.5s infinite}
@keyframes lightSweep{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.modal-body{padding:24px 28px 28px}
.modal-body h3{font:900 44px/0.9 'Barlow Condensed';margin:0 0 8px;text-transform:uppercase}
.badge{display:inline-flex;padding:6px 10px;background:var(--gold);color:#08090d;font:800 9px 'DM Sans';letter-spacing:1.8px;text-transform:uppercase;margin-bottom:16px}
.power-grid{display:grid;gap:10px;margin:18px 0}
.power-row{display:flex;align-items:center;gap:12px;font-size:11px}
.power-row span:first-child{width:52px;font:700 10px 'DM Sans';letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.power-bar{flex:1;height:4px;background:#ffffff12;position:relative;overflow:hidden;border-radius:2px}
.power-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.quote-modal{padding:18px;border-left:2px solid var(--gold);background:#15171f;color:#e7d9bf;font:italic 18px/1.4 'Barlow Condensed';margin-top:18px}
.close-x{position:absolute;right:14px;top:14px;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line2);background:rgba(255,255,255,0.04);color:white;cursor:pointer;font-size:14px}
.close-x:hover{background:white;color:#08090d}

/* Lore */
.lore{display:grid;grid-template-columns:0.95fr 1.05fr;gap:60px;align-items:center}
.book-scene{min-height:520px;display:grid;place-items:center;perspective:1200px;position:relative;background:radial-gradient(circle at 50% 50%,#d6b16c22,transparent 42%),linear-gradient(145deg,#1a1b22,#090a0e);border:1px solid var(--line);overflow:hidden;transform:translateY(20px) scale(0.98);opacity:0;transition:all 0.9s cubic-bezier(.2,.8,.2,1);clip-path:inset(0 100% 0 0)}
.book-scene.in{transform:none;opacity:1;clip-path:inset(0 0 0 0)}
.book{width:220px;height:300px;transform-style:preserve-3d;transform:rotateY(-18deg) rotateX(8deg);background:linear-gradient(90deg,#22170e,#a77b47 8%,#4a321f 15%,#6f4f2e 48%,#291a10);border:3px solid #c09a61;box-shadow:24px 28px 60px rgba(0,0,0,0.6), 0 0 0 1px #000;position:relative;display:grid;place-items:center;padding:26px;text-align:center;color:#e7c98e;font:800 22px/1.1 'Barlow Condensed';letter-spacing:2px;transition:transform 0.6s}
.book:before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#1a110a,#5a3f26);transform:translateZ(-1px)}
.book.open{transform:rotateY(-28deg) rotateX(6deg) translateZ(20px)}
.book-pages{position:absolute;right:-8px;top:6px;bottom:6px;width:16px;background:repeating-linear-gradient(to bottom,#e8d9b8 0 2px,#c9b896 2px 4px);transform:rotateY(12deg);transform-origin:left;box-shadow:4px 0 10px rgba(0,0,0,0.4)}
.lore h2{font:900 clamp(44px,6vw,78px)/0.9 'Barlow Condensed';margin:18px 0}
.lore p{font-size:13.5px;color:#bcbac2;line-height:1.9}
.type-cursor:after{content:"▌";animation:blink 1s steps(1) infinite;margin-left:2px;color:var(--gold)}
@keyframes blink{50%{opacity:0}}

/* Timeline */
.timeline-wrap{position:relative;border:1px solid var(--line);background:#0c0e14;overflow:hidden}
.timeline-track{display:flex;gap:0;overflow-x:auto;scroll-behavior:smooth;cursor:grab;padding:0;scrollbar-width:none}
.timeline-track::-webkit-scrollbar{display:none}
.timeline-track:active{cursor:grabbing}
.event{flex:0 0 clamp(300px,34vw,380px);min-height:340px;padding:32px 28px;border-right:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);transition:all 0.4s;transform-origin:center}
.event:hover,.event.active{transform:scale(1.02);background:linear-gradient(180deg,rgba(227,49,60,0.08),transparent);z-index:2;box-shadow:0 0 0 1px var(--red), 0 20px 50px rgba(0,0,0,0.5)}
.event-year{font:700 11px 'Barlow Condensed';letter-spacing:3px;color:var(--red);margin-bottom:18px}
.event h3{font:800 26px/0.95 'Barlow Condensed';margin:0 0 12px;text-transform:uppercase}
.event p{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0}
.event-tag{position:absolute;bottom:18px;left:28px;font:600 9px 'DM Sans';letter-spacing:2px;color:#666;text-transform:uppercase}
.event-dot{position:absolute;left:-5px;top:40px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 16px var(--red)}
.timeline-progress{height:2px;background:#ffffff12;position:relative;margin-top:0}
.timeline-progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 0.3s}

/* Footer */
footer{padding:70px 0 30px;background:#06070a;border-top:1px solid var(--line);position:relative;overflow:hidden}
.footer-star{position:absolute;inset:0;pointer-events:none;opacity:0.5}
.foot{display:flex;justify-content:space-between;gap:30px;position:relative;z-index:1}
.foot p{max-width:440px;color:#777;font-size:12.5px;line-height:1.8}
.footlinks{display:flex;gap:20px;flex-wrap:wrap;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#aaa}
.footlinks a:hover{color:var(--gold)}
.copy{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;color:#555;font-size:9px;letter-spacing:1.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;position:relative;z-index:1}

/* Reveal */
.reveal{opacity:0;transform:translateY(26px) scale(0.99);transition:opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1), clip-path 0.9s;clip-path:inset(0 0 100% 0)}
.reveal.in{opacity:1;transform:none;clip-path:inset(0 0 0 0)}

/* Konami flash */
.konami-flash{position:fixed;inset:0;z-index:150;background:var(--red);mix-blend-mode:screen;pointer-events:none;animation:kflash 1.2s steps(4)}
@keyframes kflash{0%,100%{opacity:0}10%,30%,50%{opacity:0.9}20%,40%,60%{opacity:0}}

/* Responsive */
@media(max-width:900px){
  .nav-links{position:absolute;top:76px;left:0;right:0;background:#08090de8;backdrop-filter:blur(22px);padding:26px;flex-direction:column;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line);transform:translateY(-120%);opacity:0;pointer-events:none;transition:all 0.4s}
  .nav-links.open{transform:none;opacity:1;pointer-events:auto}
  .menu-btn{display:block}
  .head{flex-direction:column;align-items:flex-start}
  .people{grid-template-columns:repeat(2,1fr)}
  .feature{grid-template-columns:1fr}
  .lore{grid-template-columns:1fr}
  .book-scene{min-height:420px}
  .foot{flex-direction:column}
  .timeline-track{flex-direction:column;overflow:visible;cursor:auto}
  .event{flex:none;min-height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .planet{width:92vw;right:-18%;top:18%;opacity:0.72}
}
@media(max-width:520px){
  .wrap{width:calc(100% - 28px)}
  .people{grid-template-columns:1fr 1fr}
  .k-title{font-size:clamp(66px,18vw,96px)}
  section{padding:84px 0}
  .hero{min-height:700px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none;clip-path:none}}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}

function initMap(people){
  const arch=$('#archive'),sec=document.createElement('section');sec.id='map';sec.style.paddingTop='0';
  sec.innerHTML=`<div class="wrap"><div class="head reveal in"><div><div class="kicker">Star chart</div><h2>The Universe Map</h2></div><p>Every character in orbit around their faction. Hover to scan a name, click to open the dossier.</p></div><div class="mapbox"><canvas id="mapc"></canvas><div class="legend">${Object.entries(COL).map(([f,c])=>`<span><i style="background:${c};box-shadow:0 0 8px ${c}"></i>${f}</span>`).join('')}</div></div></div>`;
  arch.parentNode.insertBefore(sec,arch);
  const mc=$('#mapc'),m=mc.getContext('2d');let w,h,vis=false,hov=null,px=-1,py=-1;
  const by={};people.forEach(p=>(by[p.f]=by[p.f]||[]).push(p));
  const C={Sentinels:[.2,.64],'Peace X Forum':[.8,.64],'The Colony':[.5,.26]},fs=Object.keys(C);
  const rs=()=>{w=mc.clientWidth;h=mc.clientHeight;mc.width=w*D;mc.height=h*D;m.setTransform(D,0,0,D,0,0)};rs();addEventListener('resize',rs);
  new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(mc);
  const mv=e=>{const r=mc.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top};
  mc.addEventListener('pointermove',mv);mc.addEventListener('pointerdown',mv);mc.addEventListener('pointerleave',()=>{px=py=-1});
  mc.addEventListener('click',()=>{
    if(!hov)return;const name=hov.p.n;
    const all=$$('.archive .chip').find(c=>c.textContent==='All');if(all)all.click();
    setTimeout(()=>{const el=$$('.person').find(q=>$('strong',q).textContent===name);if(el)el.click()},60)});
  let last=null;
  (function draw(t){
    requestAnimationFrame(draw);if(!vis)return;
    m.clearRect(0,0,w,h);const R=Math.min(w*.17,h*.27),pos=[];
    m.lineWidth=1;
    [[0,1,'227,49,60'],[0,2,'103,191,255'],[1,2,'138,203,139']].forEach(([a,b,c])=>{
      const A=C[fs[a]],B=C[fs[b]];m.strokeStyle=`rgba(${c},.35)`;m.setLineDash([4,8]);m.lineDashOffset=-t*.02;
      m.beginPath();m.moveTo(A[0]*w,A[1]*h);m.lineTo(B[0]*w,B[1]*h);m.stroke()});
    m.setLineDash([]);
    fs.forEach(f=>{
      const cx=C[f][0]*w,cy=C[f][1]*h,col=COL[f],g=m.createRadialGradient(cx,cy,0,cx,cy,R*1.6);
      g.addColorStop(0,col+'55');g.addColorStop(1,'transparent');m.fillStyle=g;m.fillRect(cx-R*2,cy-R*2,R*4,R*4);
      [.5,.75,1].forEach(k=>{m.strokeStyle=col+'33';m.beginPath();m.arc(cx,cy,R*k,0,6.283);m.stroke()});
      m.fillStyle=col;m.shadowColor=col;m.shadowBlur=24;m.beginPath();m.arc(cx,cy,7+Math.sin(t*.003)*1.5,0,6.283);m.fill();m.shadowBlur=0;
      m.fillStyle='#f4f1eb';m.font="700 13px 'Barlow Condensed',sans-serif";m.textAlign='center';m.fillText(f.toUpperCase(),cx,cy+R+22);
      const arr=by[f]||[];
      arr.forEach((p,i)=>{const k=i%3,a=i/arr.length*6.283+t*.0004*(k%2?-1:1)*(1+k*.4),r=R*(.5+k*.25);pos.push({p,col,cx,cy,x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r})})});
    hov=null;let best=18;
    pos.forEach(o=>{const d=Math.hypot(o.x-px,o.y-py);if(d<best){best=d;hov=o}});
    if(hov!==last){if(hov)blip(880,.05,.02);last=hov}
    mc.style.cursor=hov?'pointer':'default';
    pos.forEach(o=>{
      const hh=o===hov;m.fillStyle=hh?'#fff':o.col;m.shadowColor=o.col;m.shadowBlur=hh?22:8;
      m.beginPath();m.arc(o.x,o.y,hh?6:3.2,0,6.283);m.fill();m.shadowBlur=0});
    if(hov){
      m.strokeStyle=hov.col+'99';m.beginPath();m.moveTo(hov.cx,hov.cy);m.lineTo(hov.x,hov.y);m.stroke();
      const txt=`${hov.p.n} · ${hov.p.a}`;m.font="600 12px 'DM Sans',sans-serif";const tw=m.measureText(txt).width+20;
      let bx=hov.x+14;if(bx+tw>w-6)bx=hov.x-14-tw;const by2=Math.max(6,hov.y-34);
      m.fillStyle='rgba(8,9,13,.92)';m.strokeStyle=hov.col;m.fillRect(bx,by2,tw,26);m.strokeRect(bx,by2,tw,26);
      m.fillStyle='#f4f1eb';m.textAlign='left';m.fillText(txt,bx+10,by2+17)}
  })(0);
}

/* ---------- Dossier radar chart ---------- */
function initRadar(){
  new MutationObserver(()=>{
    const g=$('.power-grid');if(!g||g._r)return;g._r=1;
    const rows=$$('.power-row',g).map(r=>[r.children[0].textContent,+r.children[2].textContent]);if(rows.length<3)return;
    const n=rows.length,c=90,R=62,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[(c+Math.cos(a)*R*v/100).toFixed(1),(c+Math.sin(a)*R*v/100).toFixed(1)]};
    const grid=[25,50,75,100].map(l=>`<polygon points="${rows.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#ffffff22"/>`).join('');
    const axes=rows.map((r,i)=>{const[a,b]=pt(i,100),[lx,ly]=pt(i,132);return`<line x1="${c}" y1="${c}" x2="${a}" y2="${b}" stroke="#ffffff22"/><text x="${lx}" y="${ly}" fill="#a5a5ad" font-size="9" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">${r[0].toUpperCase()}</text>`}).join('');
    const poly=rows.map((r,i)=>pt(i,r[1]).join(',')).join(' ');
    const d=document.createElement('div');d.className='radar';
    d.innerHTML=`<svg viewBox="0 0 180 180">${grid}${axes}<polygon class="rp" points="${poly}" fill="rgba(227,49,60,.25)" stroke="#e3313c" stroke-width="1.5"/></svg>`;
    g.parentNode.insertBefore(d,g)
  }).observe(document.body,{childList:true,subtree:true});
}

/* ---------- Init ---------- */
function init(){
  const people=$$('.person').map(p=>{const[f,a]=$('small',p).textContent.split(' · ');return{n:$('strong',p).textContent,f,a}});
  initFx();initMap(people);

  const art=$('.feature-art');
  if(art){const h=document.createElement('div');h.className='hud';
    h.innerHTML='<i style="width:300px;height:300px"></i><i class="b" style="width:390px;height:390px"></i><span class="a">SUIT INTEGRITY <b id="h1">98</b>%</span><span class="b2">CORE OUTPUT <b id="h2">7.4</b> TW</span><span class="c">PORCELAIN LINK // STABLE</span>';
    art.appendChild(h);
    setInterval(()=>{const a=$('#h1'),b=$('#h2');if(a)a.textContent=96+(Math.random()*4|0);if(b)b.textContent=(7+Math.random()*.9).toFixed(1)},900)}

  const dock=document.createElement('div');dock.className='dock';
  dock.innerHTML='<button id="snd" aria-pressed="false">Ambience off</button><button id="wrp">Warp jump</button>';
  document.body.appendChild(dock);
  $('#snd').onclick=e=>{audio();on=!on;ac.resume();master.gain.linearRampToValueAtTime(on?.5:0,ac.currentTime+1.2);
    e.currentTarget.textContent=on?'Ambience on':'Ambience off';e.currentTarget.classList.toggle('on',on);e.currentTarget.setAttribute('aria-pressed',on)};
  $('#wrp').onclick=jump;
  document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('.btn,.chip,.person,.member-pill');if(t&&t!==init.l){init.l=t;blip(700,.04,.015)}});
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn,.chip,.person,.member-pill'))blip(440,.09,.03)});

  const seq=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let si=0;
  addEventListener('keydown',e=>{si=e.key===seq[si]?si+1:0;if(si===seq.length){si=0;jump();setTimeout(jump,500);award('kon','Konami code cracked')}});

  const secs=[['top','Home'],['films','Films'],['factions','Factions'],['map','Map'],['archive','Archive'],['groups','Groups'],['movies','Movies'],['villains','Villains'],['lore','Lore'],['timeline','Journey'],['files','Stories'],['classified','Classified']];
  const nav=document.createElement('nav');nav.className='dots';nav.setAttribute('aria-label','Sections');
  nav.innerHTML=secs.map(([id,l])=>`<a href="#${id}" data-l="${l}" aria-label="${l}"></a>`).join('');document.body.appendChild(nav);
  const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('a',nav).forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
  secs.forEach(([id])=>{const s=document.getElementById(id);if(s)so.observe(s)});

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){scramble(e.target);io.unobserve(e.target)}}),{threshold:.6});
  $$('.head h2,.feature-info h3,#lore h2').forEach(h=>io.observe(h));
  const w=setInterval(()=>{if($('.loader.hide')){clearInterval(w);counters()}},200);
  initPoster();initTerm(people);initPalette(people);initTrailer();initExtras(people);
}
/* ---------- Trailer intro ---------- */
let trlRun=0;
function playTrailer(){
  if(trlRun)return;trlRun=1;jump();
  const o=document.createElement('div');o.className='trl';o.innerHTML='<div class="trl-t"></div><button class="trl-skip">Skip trailer</button>';document.body.appendChild(o);
  document.body.style.overflow='hidden';
  const t=o.firstChild,cards=['In a world beyond the known','Ancient secrets <em>awaken</em>','Heroes rise from places no one looked','Antrucs <em>Universe</em>'];let i=0,tm;
  const kd=e=>{if(e.key==='Escape'||e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();end()}};
  const end=()=>{clearTimeout(tm);document.removeEventListener('keydown',kd,true);o.classList.add('out');document.body.style.overflow='';setTimeout(()=>{o.remove();trlRun=0},900);jump()};
  document.addEventListener('keydown',kd,true);o.querySelector('button').onclick=end;
  (function next(){
    if(i>=cards.length)return end();
    const last=i===cards.length-1;t.className='trl-t';t.innerHTML=cards[i++];void t.offsetWidth;
    setTimeout(()=>t.classList.add('in'),30);setTimeout(()=>t.classList.remove('in'),last?2600:1900);
    tm=setTimeout(next,last?3400:2300);blip(110,.3,.05)})();
}
function initTrailer(){
  const b=document.createElement('button');b.textContent='Trailer';b.onclick=playTrailer;$('.dock').appendChild(b);
  const w2=setInterval(()=>{if($('.loader.hide')){clearInterval(w2);let seen;try{seen=sessionStorage.getItem('av4')}catch(e){}
    if(!seen&&!reduce){try{sessionStorage.setItem('av4','1')}catch(e){}setTimeout(playTrailer,700)}}},200);
}

/* ---------- Command palette ---------- */
function openPerson(name){
  const inp=$('.search');
  if(inp&&inp.value){Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(inp,'');inp.dispatchEvent(new Event('input',{bubbles:true}))}
  const all=$$('.archive .chip').find(c=>c.textContent==='All');if(all)all.click();
  setTimeout(()=>{const el=$$('.person').find(q=>$('strong',q).textContent===name);if(el)el.click()},80)}
function initPalette(people){
  const go=id=>()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'})};
  const items=[['top','Home'],['films','The Film Files'],['factions','Factions'],['map','Universe Map'],['archive','The Archive'],['lore','The Book and the Cave'],['timeline','Jayson\u2019s Journey']].map(([id,l])=>({t:l,s:'Jump to section',f:go(id)}))
   .concat([{t:'Play trailer',s:'Action',f:playTrailer},{t:'Warp jump',s:'Action',f:jump},{t:'Toggle ambience',s:'Action',f:()=>$('#snd').click()},{t:'Open terminal',s:'Action \u00b7 backtick key',f:()=>termToggle()}]).concat(Object.keys(THEMES).map(n=>({t:'Theme: '+n,s:'Action',f:()=>setTheme(n,1)})))
   .concat(people.map(p=>({t:p.n,s:p.f+' \u00b7 '+p.a,f:()=>openPerson(p.n)}))).concat(window.AU_ITEMS||[]);
  items.forEach(i=>{i.k=(i.t+' '+i.s).toLowerCase()});
  const pal=document.createElement('div');pal.className='pal';pal.setAttribute('role','dialog');pal.setAttribute('aria-label','Search the universe');
  pal.innerHTML='<div class="pal-box"><input placeholder="Search characters, sections, actions..." aria-label="Search"><ul></ul></div>';document.body.appendChild(pal);
  const inp=$('input',pal),ul=$('ul',pal);let res=[],sel=0;
  const render=()=>{const q=inp.value.trim().toLowerCase();res=items.filter(i=>!q||i.k.includes(q)).slice(0,40);sel=Math.min(sel,Math.max(0,res.length-1));
    ul.innerHTML=res.length?res.map((r,i)=>`<li class="${i===sel?'sel':''}" data-i="${i}"><span>${r.t}</span><small>${r.s}</small></li>`).join(''):'<li>No match. Try a name like Void or Lumina.</li>';
    const s=$('.sel',ul);if(s)s.scrollIntoView({block:'nearest'})};
  const close=()=>pal.classList.remove('open');
  const open=()=>{pal.classList.add('open');inp.value='';sel=0;render();inp.focus();blip(520,.06,.03)};
  const pick=i=>{const r=res[i];if(!r)return;close();setTimeout(r.f,60)};
  inp.addEventListener('input',()=>{sel=0;render()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(res.length-1,sel+1);render()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);render()}
    else if(e.key==='Enter'){e.preventDefault();pick(sel)}
    else if(e.key==='Escape'){e.stopPropagation();close()}});
  ul.addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)pick(+li.dataset.i)});
  pal.addEventListener('pointerdown',e=>{if(e.target===pal)close()});
  addEventListener('keydown',e=>{
    const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if((e.key==='k'&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing)){e.preventDefault();pal.classList.contains('open')?close():open()}});
  const b=document.createElement('button');b.textContent='Search \u00b7 Ctrl K';b.onclick=open;$('.dock').appendChild(b);
}

/* ---------- Poster parallax ---------- */
function initPoster(){
  const a=$('.feature-art');if(!a)return;
  const mk=(c,t)=>{const d=document.createElement('div');d.className='pz '+c;if(t)d.textContent=t;return d};
  [mk('pz-g'),mk('pz-t','Sentinel'),mk('pz-s')].forEach(d=>a.insertBefore(d,a.firstChild));
  a.appendChild(mk('pz-f'));a.appendChild(mk('pz-c','ANTRUCS UNIVERSE PRESENTS \u00b7 FILM 001'));
  a.addEventListener('pointermove',e=>{const r=a.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    a.style.setProperty('--px',((x-.5)*2).toFixed(3));a.style.setProperty('--py',((y-.5)*2).toFixed(3));a.style.setProperty('--gx',x*100+'%');a.style.setProperty('--gy',y*100+'%')});
  a.addEventListener('pointerleave',()=>{a.style.setProperty('--px','0');a.style.setProperty('--py','0')});
}

/* ---------- Themes, achievements, orbs, terminal ---------- */
const THEMES={Original:['#e3313c','#d6b16c'],'Sentinel Blue':['#31a8ff','#9fd8ff'],'Peace Rose':['#ff5d8f','#ffc2d6'],'Colony Green':['#4fd18b','#c8f0a0']};
const ach=new Set(),opened=new Set(),seenS=new Set(),TOT=8;let energy=0,sc,term;
function toast(t){let h=$('.toasts');if(!h){h=document.createElement('div');h.className='toasts';document.body.appendChild(h)}
  const d=document.createElement('div');d.className='toast';d.textContent=t;h.appendChild(d);setTimeout(()=>d.remove(),3600)}
function upd(){if(sc)sc.textContent='\u2605 '+ach.size+'/'+TOT+' \u00b7 Energy '+energy}
function award(id,l){if(ach.has(id))return;ach.add(id);toast('\u2605 Achievement: '+l);blip(988,.25,.04);upd()}
function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*4;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:'214,177,108'})}}
function setTheme(n,user){const th=THEMES[n];if(!th)return;const s=document.documentElement.style;s.setProperty('--red',th[0]);s.setProperty('--gold',th[1]);
  try{localStorage.setItem('av4t',n)}catch(e){}if(user){toast('Theme: '+n);if(n!=='Original')award('thm','Style shifter')}}
function orb(){
  setTimeout(orb,6000+Math.random()*6000);if(trlRun||document.hidden)return;
  const o=document.createElement('button');o.className='orb';o.setAttribute('aria-label','Collect energy orb');o.style.left=(8+Math.random()*80)+'vw';o.style.top=(15+Math.random()*65)+'vh';document.body.appendChild(o);
  const kill=setTimeout(()=>o.remove(),7000);
  o.onclick=()=>{clearTimeout(kill);const r=o.getBoundingClientRect();burst(r.left+13,r.top+13,24);o.remove();energy++;blip(1250,.12,.04);
    if(energy===5)award('e5','Energy collector');if(energy===15)award('e15','Cave reactor online');upd()}}
function initExtras(people){
  try{const n=localStorage.getItem('av4t');if(n)setTheme(n)}catch(e){}
  const al=document.createElement('div');al.className='aur';document.body.insertBefore(al,document.body.firstChild);
  const pg=document.createElement('div');pg.className='prog';document.body.appendChild(pg);
  addEventListener('scroll',()=>{pg.style.transform='scaleX('+(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)).toFixed(4)+')'},{passive:true});
  const dk=$('.dock'),tb=document.createElement('button');tb.textContent='Theme';
  tb.onclick=()=>{const k=Object.keys(THEMES),c=getComputedStyle(document.documentElement).getPropertyValue('--red').trim(),i=k.findIndex(n=>THEMES[n][0]===c);setTheme(k[(i+1)%k.length],1)};dk.appendChild(tb);
  sc=document.createElement('span');sc.className='dscore';dk.appendChild(sc);upd();
  document.addEventListener('click',e=>{const p=e.target.closest&&e.target.closest('.person'),n=p&&$('strong',p);
    if(n){opened.add(n.textContent);award('d1','First dossier opened');if(opened.size>=5)award('d5','Dossier hunter')}});
  const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){seenS.add(e.target.id);if(seenS.size>=12)award('exp','Universe explorer')}}),{rootMargin:'-40% 0px -40% 0px'});
  ['top','films','factions','map','archive','groups','movies','villains','lore','timeline','files','classified'].forEach(id=>{const s=document.getElementById(id);if(s)so.observe(s)});
  setTimeout(orb,5000);
}
function termToggle(){term.classList.toggle('open');if(term.classList.contains('open')){$('input',term).focus();award('trm','Hacked the mainframe')}}
function initTerm(people){
  term=document.createElement('div');term.className='term';
  term.innerHTML='<div class="term-o"></div><label class="term-i"><span>antrucs@universe:~$</span><input autocomplete="off" spellcheck="false" aria-label="Terminal command"></label>';document.body.appendChild(term);
  const out=$('.term-o',term),inp=$('input',term),secs=['top','films','factions','map','archive','groups','movies','villains','lore','timeline','files','classified'];
  const say=t=>{out.textContent+=t+'\n';out.scrollTop=out.scrollHeight};say('ANTRUCS UNIVERSE TERMINAL v4. Type help.');
  const C={help:()=>'commands: help, factions, who <name>, theme <name>, goto <section>, warp, trailer, sound, stats, clear, exit',
    factions:()=>Object.keys(COL).map(f=>f+': '+people.filter(p=>p.f===f).length+' members').join('\n'),
    who:a=>{const q=a.toLowerCase(),r=people.filter(p=>(p.n+' '+p.a).toLowerCase().includes(q));return q&&r.length?r.map(p=>p.n+' \u2014 '+p.a+' ('+p.f+')').join('\n'):'no records found'},
    theme:a=>{const n=Object.keys(THEMES).find(k=>k.toLowerCase().includes(a.toLowerCase()));if(!a||!n)return 'themes: '+Object.keys(THEMES).join(', ');setTheme(n,1);return 'theme set: '+n},
    goto:a=>{const s=secs.find(x=>x.includes(a.toLowerCase()));if(!a||!s)return 'sections: '+secs.join(', ');termToggle();document.getElementById(s).scrollIntoView({behavior:'smooth'});return ''},
    warp:()=>{jump();return 'engaging hyperdrive...'},trailer:()=>{termToggle();playTrailer();return ''},sound:()=>{$('#snd').click();return 'ambience toggled'},
    stats:()=>'achievements '+ach.size+'/'+TOT+', energy '+energy+', dossiers opened '+opened.size,clear:()=>{out.textContent='';return ''},exit:()=>{termToggle();return ''}};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')termToggle();if(e.key!=='Enter')return;
    const v=inp.value.trim();inp.value='';say('> '+v);const[c,...r]=v.split(' '),f=C[c.toLowerCase()],o=f?f(r.join(' ')):(v?'command not found: '+c:'');if(o)say(o)});
  addEventListener('keydown',e=>{if(e.key==='`'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();termToggle()}});
}

const t=setInterval(()=>{if($('#archive')&&$('#classified')&&$$('.person').length){clearInterval(t);init()}},100);
})();
